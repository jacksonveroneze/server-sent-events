<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotations Realtime - SSE Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-2xl font-bold text-gray-800">Quotations Realtime</h1>
          <div id="status" class="flex items-center gap-2">
            <div
              id="status-indicator"
              class="w-3 h-3 rounded-full bg-green-500 animate-pulse"
            ></div>
            <span id="status-text" class="text-sm text-gray-600"
              >Connected</span
            >
          </div>
        </div>

        <div
          id="quotations-container"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"
        >
          <p class="text-gray-500 text-center py-8 col-span-full">
            Waiting for quotations...
          </p>
        </div>
      </div>
    </div>

    <script>
      const quotationsContainer = document.getElementById(
        "quotations-container"
      );
      const statusIndicator = document.getElementById("status-indicator");
      const statusText = document.getElementById("status-text");

      // EventSource automatically handles reconnection and Last-Event-ID header
      const eventSource = new EventSource(
        "http://localhost:7000/quotations/realtime"
      );

      eventSource.addEventListener("quotations", (event) => {
        try {
          const eventData = JSON.parse(event.data);
          upsertQuotation(eventData);
        } catch (error) {
          console.error("Error parsing quotation:", error);
        }
      });

      eventSource.onopen = () => {
        statusIndicator.className =
          "w-3 h-3 rounded-full bg-green-500 animate-pulse";
        statusText.textContent = "Connected";
      };

      eventSource.onmessage = (event) => {
        try {
          const eventData = JSON.parse(event.data);
          upsertQuotation(eventData);
        } catch (error) {
          console.error("Error parsing quotation:", error);
        }
      };

      eventSource.onerror = () => {
        if (eventSource.readyState === EventSource.CONNECTING) {
          statusIndicator.className =
            "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";
          statusText.textContent = "Reconnecting...";
        } else if (eventSource.readyState === EventSource.CLOSED) {
          statusIndicator.className = "w-3 h-3 rounded-full bg-red-500";
          statusText.textContent = "Disconnected";
        }
      };

      function upsertQuotation(quotation) {
        const { tickerId, value } = quotation;
        if (!tickerId) return;

        // Remove "Waiting for quotations..." message if present
        const waitingMessage = quotationsContainer.querySelector("p");
        if (
          waitingMessage &&
          waitingMessage.textContent.includes("Waiting")
        ) {
          waitingMessage.remove();
        }

        const isNegative = value < 0;
        const valueColorClass = isNegative ? "text-red-600" : "text-green-600";
        const formattedValue = `${isNegative ? "-" : ""}R$ ${Math.abs(
          value
        ).toFixed(2)}`;

        let block = quotationsContainer.querySelector(
          `[data-ticker-id="${tickerId}"]`
        );

        if (!block) {
          // Create block if it doesn't exist yet
          block = document.createElement("div");
          block.setAttribute("data-ticker-id", tickerId);
          block.className =
            "border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow";
          block.innerHTML = `
                <p class="font-semibold text-gray-800">${tickerId}</p>
                <p class="value text-2xl font-bold ${valueColorClass}">${formattedValue}</p>
            `;
          quotationsContainer.appendChild(block);
        } else {
          // Update value in place if block already exists
          const valueElement = block.querySelector(".value");
          valueElement.textContent = formattedValue;
          valueElement.className = `value text-2xl font-bold ${valueColorClass}`;
        }
      }
    </script>
  </body>
</html>
